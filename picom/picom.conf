#       General Settings 
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;
detect-client-opacity = true;
detect-transient = true;

-----------------------------------------------------------
#           Corners  
corner-radius = 8;
detect-rounded-corners = true;

corner-radius-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c" 
];
-----------------------------------------------------------
#            Shadows
shadow = false;

-----------------------------------------------------------
#             Fading 
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
-----------------------------------------------------------
#   Transparency / Opacity   
frame-opacity = 1.0; 

-----------------------------------------------------------
#Blur
blur-background = false;

-----------------------------------------------------------
animations = (
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.16;
    scale = 1.0;
  },
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.16;
    scale = 0.98;
  }
);

-----------------------------------------------------------
#       Rule-based Options 
rules: ( 
-----------------------------------------------------------
  # Pop-up Panel & Menu 
  {
    match = "window_type = 'dropdown_menu' || "
            "window_type = 'popup_menu' || "
            "window_type = 'menu' || "
            "window_type = 'utility' || "
            "window_type = 'dialog'";
    opacity = 1.00;
    fade = false;
  },
  {
    match = "window_type = 'tooltip'";
    fade = false;
    opacity = 1.00;
  },

-----------------------------------------------------------
  #  Window  & Element Desktop
  {
    match = "window_type = 'dock' || window_type = 'desktop'";
    corner-radius = 0;
  },

-----------------------------------------------------------
  # Opacity
  {
    match = "class_g *?= 'copyq'";
    opacity = 1.00; # CopyQ diatur agar 100% solid tidak transparan
  },
  {
    match = "name = 'alttab'";
    opacity = 0.90;
  },

-----------------------------------------------------------
  # Animation
  {
    match = "MANUAL@ != 1";
    animations = ({
      triggers = ["geometry"];
      preset = "geometry-change";
      duration = 0.16;
    });
  }
)
